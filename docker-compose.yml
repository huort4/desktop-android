# Defaults for everything not listed here live in the Dockerfile (ENV).
# The values below MUST match the Dockerfile; they exist so .env can override them.
services:
  desktop:
    build:
      context: .
    container_name: claude-remote-desktop
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Tehran}
      CUSTOM_USER: ${WEBTOP_USER:?Set WEBTOP_USER in .env or the deployment environment}
      PASSWORD: ${WEBTOP_PASSWORD:?Set WEBTOP_PASSWORD in .env or the deployment environment}

      # X11 (false) keeps android-perf.sh effective. Set true for Wayland.
      PIXELFLUX_WAYLAND: ${PIXELFLUX_WAYLAND:-false}

      # Stream tuning (mobile-first balanced profile)
      MAX_RES: ${MAX_RES:-1280x720}
      SELKIES_ENCODER: ${SELKIES_ENCODER:-x264enc-striped}
      SELKIES_FRAMERATE: ${SELKIES_FRAMERATE:-24}
      SELKIES_H264_CRF: ${SELKIES_H264_CRF:-30}
      SELKIES_AUDIO_ENABLED: ${SELKIES_AUDIO_ENABLED:-false|locked}
    ports:
      # HTTPS is the supported direct-access endpoint. Do not expose 3000 publicly.
      - "${WEBTOP_HTTPS_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - ./config:/config
    restart: unless-stopped
    shm_size: "2gb"
    healthcheck:
      # Basic auth is enabled, so authenticate; plain `curl -f` would get 401.
      test: ["CMD-SHELL", "curl -kfsS -o /dev/null -u \"$${CUSTOM_USER}:$${PASSWORD}\" https://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-4}"
          memory: ${MEMORY_LIMIT:-4G}
