# Local development: bind everything to localhost only.
# `!override` replaces the base `ports` list instead of appending to it
# (otherwise 3001 would be bound twice). Requires Docker Compose >= 2.24.
services:
  desktop:
    ports: !override
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
